<!DOCTYPE html>
<html lang="en" id="htmlRoot">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <title><%= VITE_GLOB_APP_TITLE %></title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="app">
      <style>
        html[data-theme='dark'] .app-loading {
          background-color: #2c344a;
        }

        html[data-theme='dark'] .app-loading .app-loading-title {
          color: rgb(255 255 255 / 85%);
        }

        .app-loading {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          background-color: #f4f7f9;
        }

        .app-loading .app-loading-wrap {
          display: flex;
          position: absolute;
          top: 50%;
          left: 50%;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          transform: translate3d(-50%, -50%, 0);
        }

        .app-loading .dots {
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 98px;
        }

        .app-loading .app-loading-title {
          display: flex;
          align-items: center;
          justify-content: center;
          margin-top: 30px;
          color: rgb(0 0 0 / 85%);
          font-size: 30px;
        }

        .app-loading .app-loading-logo {
          display: block;
          width: 90px;
          margin: 0 auto;
          margin-bottom: 20px;
        }

        .dot {
          display: inline-block;
          position: relative;
          box-sizing: border-box;
          width: 48px;
          height: 48px;
          margin-top: 30px;
          transform: rotate(45deg);
          animation: ant-rotate 1.2s infinite linear;
          font-size: 32px;
        }

        .dot i {
          display: block;
          position: absolute;
          width: 20px;
          height: 20px;
          transform: scale(0.75);
          transform-origin: 50% 50%;
          animation: ant-spin-move 1s infinite linear alternate;
          border-radius: 100%;
          opacity: 0.3;
          background-color: #0065cc;
        }

        .dot i:nth-child(1) {
          top: 0;
          left: 0;
        }

        .dot i:nth-child(2) {
          top: 0;
          right: 0;
          animation-delay: 0.4s;
        }

        .dot i:nth-child(3) {
          right: 0;
          bottom: 0;
          animation-delay: 0.8s;
        }

        .dot i:nth-child(4) {
          bottom: 0;
          left: 0;
          animation-delay: 1.2s;
        }

        @keyframes ant-rotate {
          to {
            transform: rotate(405deg);
          }
        }

        @keyframes ant-rotate {
          to {
            transform: rotate(405deg);
          }
        }

        @keyframes ant-spin-move {
          to {
            opacity: 1;
          }
        }

        @keyframes ant-spin-move {
          to {
            opacity: 1;
          }
        }

        /* 纯 CSS 星环 logo：与 src/design/public.less 中 .logo-icon 保持一致，首屏阶段 CSS 未加载故内联一份 */
        .logo-icon {
          position: relative;
          display: inline-block;
          width: 32px;
          height: 32px;
          flex-shrink: 0;
          border-radius: 50%;
        }

        .logo-icon::before {
          content: '';
          position: absolute;
          inset: 0;
          border-radius: 50%;
          background: conic-gradient(
            from 0deg,
            #00d2ff,
            #7c3aed 30%,
            #ff2e88 58%,
            #ffd166 82%,
            #00d2ff
          );
          -webkit-mask: radial-gradient(
            farthest-side,
            transparent calc(100% - 26%),
            #000 calc(100% - 26%)
          );
          mask: radial-gradient(farthest-side, transparent calc(100% - 26%), #000 calc(100% - 26%));
          filter: drop-shadow(0 0 4px rgba(0, 210, 255, 0.9));
          animation: vben-logo-spin 4s linear infinite;
        }

        .logo-icon::after {
          content: '';
          position: absolute;
          inset: 27%;
          border-radius: 50%;
          background: radial-gradient(
            circle at 32% 30%,
            #fff 0%,
            #bae6fd 34%,
            #60a5fa 72%,
            #7c3aed 100%
          );
          box-shadow: 0 0 12px 1px rgba(129, 140, 248, 0.6);
          animation: vben-logo-pulse 3s ease-in-out infinite;
        }

        .app-loading .logo-icon {
          width: 90px;
          height: 90px;
        }

        @keyframes vben-logo-spin {
          to {
            transform: rotate(360deg);
          }
        }

        @keyframes vben-logo-pulse {
          0%,
          100% {
            transform: scale(0.92);
            opacity: 0.85;
          }

          50% {
            transform: scale(1.06);
            opacity: 1;
          }
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-wrap">
          <!-- 纯 CSS 星环 logo（样式与 src/design/public.less 中 .logo-icon 保持一致） -->
          <span class="logo-icon app-loading-logo" aria-hidden="true"></span>
          <div class="app-loading-dots">
            <span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="app-loading-title"><%= VITE_GLOB_APP_TITLE %></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
